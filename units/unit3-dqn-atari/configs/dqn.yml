SpaceInvadersNoFrameskip-v4: # pass to DQN contructor
  env_wrapper:
    - stable_baselines3.common.atari_wrappers.AtariWrapper
  frame_stack: 4
  policy: 'CnnPolicy'
  n_timesteps: 50000        # short so trials finish
  buffer_size: 100000          # smaller, fits in RAM (~5.6 GB float32)
  learning_rate: !!float 1e-4
  batch_size: 32
  learning_starts: 100000
  target_update_interval: 1000
  train_freq: 4
  gradient_steps: 1
  exploration_fraction: 0.1
  exploration_final_eps: 0.01
  optimize_memory_usage: False # helps save memory but would avoid conflics
