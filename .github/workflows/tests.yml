name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the commit-metadata check reads the full history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/test.txt
      - run: pip install -r requirements/test.txt
      - name: pytest (fast)
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}   # personal-info regexes, kept out of the repo
          # secrets are not exposed to pull requests from forks, so only require the patterns on this repo's own runs
          PRIVATE_PATTERNS_REQUIRED: ${{ github.event.pull_request.head.repo.fork == true && '0' || '1' }}
        run: python -m pytest -m "not smoke and not network" -ra
